# Single implement phase, using the REAL default implement prompt
# (feature/implement.md) and the same tools the feature pipeline's implement
# phase uses. This is the template phase-granularity coder evals run on, so the
# eval exercises the actual pipeline prompt — not a stub.
template: implement

phases:
  - name: implement
    type: agent
    prompt: feature/implement.md
    # Generous loop budget — local/self-hosted models take more tool rounds to
    # implement + build + fix than a frontier model.
    max_tool_rounds: 200
    # Same toolset as the real `feature` pipeline's implement phase, so the eval
    # measures production behavior — not an agent hobbled by a narrower allowlist.
    tools:
      files: true
      bash:
        allowed:
          - "make*"
          - "cargo*"
          - "npm*"
          - "yarn*"
          - "pnpm*"
          - "go*"
          - "python -m*"
          - "pytest*"
          - "uv*"
          - "ruff*"
          - "rm*"
