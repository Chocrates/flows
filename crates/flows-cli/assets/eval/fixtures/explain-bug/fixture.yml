# A small reasoner fixture: no shell verifier — success is a manual grade against
# the rubric (`flows eval review`). The agent should diagnose, not necessarily
# edit code.
suite: reasoner
size: small
granularity: phase
task: "The function sum_to(n) in calc.sh is meant to return 1+2+...+n but returns the wrong total. Explain the root cause of the bug and describe the one-line fix. Be specific about which line and why."
template: plan
rubric: |
  - Identifies the off-by-one: the loop uses `while [ $i -lt $n ]` so it stops at n-1 and never adds n.
  - Proposes the correct fix (`-le` instead of `-lt`, or start/stop bounds adjusted).
  - Explanation is specific to the actual code, not generic.
# Preloaded into the prompt so a read-incapable reasoner sees the code up front.
relevant:
  - calc.sh
timeout_secs: 600
