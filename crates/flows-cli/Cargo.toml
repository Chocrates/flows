[package]
name = "flows-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "flows"
path = "src/main.rs"

[dependencies]
flows-core  = { path = "../flows-core" }
flows-tools = { path = "../flows-tools" }
flows-llm   = { path = "../flows-llm" }
flows-runner = { path = "../flows-runner" }
flows-tui   = { path = "../flows-tui" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = { workspace = true }
serde_json = { workspace = true }
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
include_dir = "0.7"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
