schema: spec-driven

context: |
  flows — a local-first, terminal workflow runner for LLM coding agents. It runs
  multi-phase agent pipelines (plan → implement → lint → test → review → commit)
  against a codebase, sandboxed and resumable. Built to run offline against a
  local llama.cpp (OpenAI-compatible) server; also supports Anthropic / OpenAI.

  Tech stack: Rust (stable, edition 2021), a Cargo workspace of 6 crates:
    - flows-core   config/state/templates/pricing/usage/estimate/detect/dryrun
    - flows-tools  files, sandbox (bwrap on Linux / Seatbelt on macOS), bash,
                   plugin, http (SSRF-guarded), web_search
    - flows-llm    Provider trait + Anthropic / OpenAI translation & streaming
    - flows-runner phases (agent/script/human), linear + DAG, loops, retries
    - flows-tui    ratatui launcher, live run view, reattach view (shared App)
    - flows-cli    the `flows` binary
  Key deps: tokio, reqwest(rustls), serde/serde_json/serde_yaml_ng, minijinja,
  ratatui/crossterm, include_dir, tiktoken-rs, clap.

  Conventions:
    - Every change must pass the gate: `cargo fmt --all --check`,
      `cargo clippy --all-targets -- -D warnings`, and `cargo test` (all green).
    - Prefer `make` targets for tooling where a Makefile exists (see AGENTS.md);
      script phases resolve `@auto:test` / `@auto:lint` at run time.
    - On-disk formats (state.json, artifacts, llm.jsonl) are serde-shaped and
      stability-sensitive — don't change them casually.
    - Security is first-class: shell commands are sandboxed + network-denylisted;
      file tools are repo-scoped (no `..`/symlink escape); http is SSRF-guarded.
      Preserve these invariants.
    - License MIT.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  proposal:
    - "Name any security invariant the change touches (sandbox, path-scoping, SSRF) and how it stays intact."
    - "Note if an on-disk format (state.json, artifacts, llm.jsonl) changes."
  tasks:
    - "Every task ends green: cargo fmt --check, clippy -D warnings, cargo test all passing."
